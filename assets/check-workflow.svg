<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" role="img" aria-label="三模块报告人工复核流程"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#6784ad" stroke-width="1.5"/></marker></defs><rect width="1040" height="760" fill="#ffffff"/><style>text{font-family:-apple-system,'PingFang SC',sans-serif;fill:#14305a}.title{font-size:27px;font-weight:650}.node{font-size:19px;font-weight:600}.small{font-size:15px;fill:#607695}.line{fill:none;stroke:#6784ad;stroke-width:2;marker-end:url(#arrow)}</style><text x="32" y="46" class="title">报告文本自检：实际用户操作与失败分支</text><text x="32" y="77" class="small">只使用合成文本；三类规则可操作；模型未连接，不自动改写</text><rect x="340" y="110" width="360" height="88" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="358" y="142">选择案例 / 输入双文本</text><text class="small" x="358" y="170">本人选择模块，点击开始检查</text><path class="line" d="M520 198V223"/><polygon points="520,227 655,278 520,329 385,278" fill="#fff9e9" stroke="#cbd9ec"/><text x="453" y="284" class="node">输入可检查？</text><rect x="36" y="239" width="295" height="85" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="54" y="271">未完成 / 补充后重试</text><text class="small" x="54" y="299">缺输入、无模块、请求失败</text><path class="line" d="M385 278H337"/><text x="347" y="267" class="small">否</text><rect x="340" y="368" width="360" height="105" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="358" y="400">三模块规则检查</text><text class="small" x="358" y="428">侧别 · 尺寸单位 · 肯定否定</text><text class="small" x="358" y="452">唯一配对与覆盖原因</text><path class="line" d="M520 329V362"/><text x="532" y="350" class="small">是</text><rect x="36" y="519" width="295" height="105" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="54" y="551">没有可比较内容</text><text class="small" x="54" y="579">不当成报告通过</text><text class="small" x="54" y="603">显示未知 / 未覆盖原因</text><rect x="371" y="519" width="295" height="105" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="389" y="551">未发现当前范围问题</text><text class="small" x="389" y="579">保留范围和来源</text><text class="small" x="389" y="603">不能替代医师审核</text><rect x="706" y="519" width="295" height="105" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="724" y="551">发现待核对项</text><text class="small" x="724" y="579">两段原文证据 + 人工建议</text><text class="small" x="724" y="603">反馈不会改报告</text><path class="line" d="M520 473V495H183V513"/><path class="line" d="M520 473V513"/><path class="line" d="M520 473V495H853V513"/><path class="line" d="M853 624V684H1018V154H705"/><text x="622" y="672" class="small">人工修改 → 重新检查 → 比较 / 导出</text><text x="126" y="723" class="small">编辑、换模块、清空会取消旧请求并使旧结果失效；记录仅保存在当前页面内存</text></svg>
