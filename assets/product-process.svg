<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="产品经理与AI协作全过程"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#6784ad" stroke-width="1.5"/></marker></defs><rect width="1200" height="550" fill="#ffffff"/><style>text{font-family:-apple-system,'PingFang SC',sans-serif;fill:#14305a}.title{font-size:27px;font-weight:650}.node{font-size:19px;font-weight:600}.small{font-size:15px;fill:#607695}.line{fill:none;stroke:#6784ad;stroke-width:2;marker-end:url(#arrow)}</style><text x="30" y="48" class="title">报告质控：产品经理与 AI 协作的证据链</text><text x="30" y="78" class="small">个人 MVP · 方法链已展开，真实用户验证与公开发布待完成</text><rect x="30" y="115" width="175" height="148" rx="7" fill="#fff9e9" stroke="#cbd9ec"/><text class="node" x="48" y="147">01 问题假设</text><text class="small" x="48" y="175">用户提供场景</text><text class="small" x="48" y="199">AI梳理任务/假设</text><text class="small" x="48" y="223">医师访谈暂缓</text><path class="line" d="M205 187H221"/><rect x="223" y="115" width="175" height="148" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="241" y="147">02 产品定义</text><text class="small" x="241" y="175">目标/范围/优先级</text><text class="small" x="241" y="199">三规则先跑闭环</text><text class="small" x="241" y="223">非医院级平台</text><path class="line" d="M398 187H414"/><rect x="416" y="115" width="175" height="148" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="434" y="147">03 流程与原型</text><text class="small" x="434" y="175">工作流/PRD/状态</text><text class="small" x="434" y="199">证据与人工复检</text><text class="small" x="434" y="223">用户回来评审</text><path class="line" d="M591 187H607"/><rect x="609" y="115" width="175" height="148" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="627" y="147">04 AI 协作</text><text class="small" x="627" y="175">AI辅助实现</text><text class="small" x="627" y="199">本人作关键取舍</text><text class="small" x="627" y="223">模型接入待定</text><path class="line" d="M784 187H800"/><rect x="802" y="115" width="175" height="148" rx="7" fill="#f3f7fd" stroke="#cbd9ec"/><text class="node" x="820" y="147">05 验收迭代</text><text class="small" x="820" y="175">案例/技术/浏览器</text><text class="small" x="820" y="199">失败与改动留证</text><text class="small" x="820" y="223">本人验收待做</text><path class="line" d="M977 187H993"/><rect x="995" y="115" width="175" height="148" rx="7" fill="#fff9e9" stroke="#cbd9ec"/><text class="node" x="1013" y="147">06 交付复盘</text><text class="small" x="1013" y="175">本机演示与文档</text><text class="small" x="1013" y="199">职责/证据/局限</text><text class="small" x="1013" y="223">公开入口待发布</text><rect x="416" y="330" width="370" height="128" rx="7" fill="#f7f4ff" stroke="#cbd9ec"/><text class="node" x="434" y="362">方案分支：资料依据解释</text><text class="small" x="434" y="390">确有外部资料问答需求时评估 RAG</text><text class="small" x="434" y="414">来源 → 检索 → 生成 → 引用校验</text><text class="small" x="434" y="438">仅有方案，尚未接入模型/索引</text><path class="line" stroke-dasharray="6 5" d="M503 263V318"/><text x="524" y="306" class="small">按需求选择，不堆技术</text><text x="30" y="507" class="small">证据原则：文档、原型、功能、测试对应；计划不冒充结果，AI 产出不自动等于本人掌握</text></svg>
