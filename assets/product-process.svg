<rect width="1200" height="400" fill="white"/>
<style>text{font-family:-apple-system,'PingFang SC',sans-serif;fill:#14305a}.title{font-size:28px;font-weight:650}.node{font-size:19px;font-weight:600}.small{font-size:16px;fill:#526b8d}.line{fill:none;stroke:#6784ad;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="30" y="48" class="title">报告质控项目构建流程</text>
<text x="30" y="80" class="small">文本一致性检查 · 规则优先 · 可选语义复核 · 人工修改与复检</text>
<g fill="#f3f7fd" stroke="#cbd9ec"><rect x="30" y="118" width="175" height="158" rx="7"/><rect x="223" y="118" width="175" height="158" rx="7"/><rect x="416" y="118" width="175" height="158" rx="7"/><rect x="609" y="118" width="175" height="158" rx="7"/><rect x="802" y="118" width="175" height="158" rx="7"/><rect x="995" y="118" width="175" height="158" rx="7"/></g>
<g class="line"><path d="M205 197H219"/><path d="M398 197H412"/><path d="M591 197H605"/><path d="M784 197H798"/><path d="M977 197H991"/></g>
<text x="48" y="153" class="node">01 问题定义</text><text x="48" y="185" class="small">报告提交前自检</text><text x="48" y="214" class="small">对比两段文本</text><text x="48" y="243" class="small">明确人工责任</text>
<text x="241" y="153" class="node">02 范围与规则</text><text x="241" y="185" class="small">侧别 尺寸 肯否</text><text x="241" y="214" class="small">限定对象与表达</text><text x="241" y="243" class="small">定义无法比较</text>
<text x="434" y="153" class="node">03 工作流设计</text><text x="434" y="185" class="small">输入与证据展示</text><text x="434" y="214" class="small">修改复检与反馈</text><text x="434" y="243" class="small">记录筛选与导出</text>
<text x="627" y="153" class="node">04 方案实现</text><text x="627" y="185" class="small">规则与可选模型</text><text x="627" y="214" class="small">证据与结果校验</text><text x="627" y="243" class="small">失败保留规则</text>
<text x="820" y="153" class="node">05 验证迭代</text><text x="820" y="185" class="small">合成案例与回归</text><text x="820" y="214" class="small">真实模型小样本</text><text x="820" y="243" class="small">类别待核对策略</text>
<text x="1013" y="153" class="node">06 版本交付</text><text x="1013" y="185" class="small">本机应用与文档</text><text x="1013" y="214" class="small">清单与指纹核对</text><text x="1013" y="243" class="small">公开项目仓库</text>
<text x="30" y="326" class="small">开发与技术验证采用 AI 辅助；需求假设与临床使用价值仍需外部验证。</text>
<text x="30" y="357" class="small">当前未实施：医院部署、临床效果评测、完整 RAG 与公网应用托管。更新于 2026-10-21。</text>
</svg>
